name: GestorDB installation lint
on:
  push:
    branches: [main, installer-web-2026]
  pull_request:
jobs:
  php-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - run: |
          php -l install/index.php
          php -l db.php
          php -l GestorDB.php
          php -l GestorKeys.php
          php -l GestorFieldRenderer.php
          php -l GestorFieldCodec.php
          php tests/typed-fields.php
          php tests/installer-path.php
          php -l dashboard.php
          php -l dashboard-legacy.php
          php -l SchemaHierarchy.php
          php -l main05.php
          php -l procesar.php
          php -l index.php
          php -l GestorAccess.php
          php -l SchemaEditor.php
          php -l schema-process.php
          php -l SchemaKeys.php
          php -l schema-keys-process.php
          php -l RelationNavigator.php
          php -l OwnershipPolicy.php
          php -l OwnedWriteGuard.php
          php tests/owned-writes.php
          php tests/ownership-policy.php
      - name: Package deployable web installer
        if: github.ref == 'refs/heads/main'
        run: |
          zip -q -r GestorDB-installer.zip *.php install assets *.md LICENSE -x 'dashboard-legacy.php'
          unzip -l GestorDB-installer.zip
      - name: Upload installer ZIP
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GestorDB-installer
          path: GestorDB-installer.zip
          retention-days: 30
